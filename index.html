let currentLanguage = localStorage.getItem("language") || "ar";
let currentCategory = "breaking";

const appNameElement = document.getElementById("appName");
const appDescriptionElement = document.getElementById("appDescription");
const sectionTitleElement = document.getElementById("sectionTitle");
const languageSelectElement = document.getElementById("languageSelect");
const refreshButtonElement = document.getElementById("refreshButton");
const newsContainerElement = document.getElementById("newsContainer");
const categoryButtons = document.querySelectorAll(".category-button");
const currentYearElement = document.getElementById("currentYear");

function getCurrentText() {
  return translations[currentLanguage];
}

function updateInterface() {
  const text = getCurrentText();

  document.documentElement.lang = currentLanguage;
  document.documentElement.dir = text.direction;

  appNameElement.textContent = text.name;
  appDescriptionElement.textContent = text.description;
  sectionTitleElement.textContent = text.latest;
  refreshButtonElement.textContent = text.refresh;

  categoryButtons.forEach((button) => {
    const category = button.dataset.category;
    button.textContent = text.categories[category];
  });

  languageSelectElement.value = currentLanguage;
}

function formatDate(dateValue) {
 ```javascript
  if (!dateValue) {
    return "";
  }

  const locale =
    currentLanguage === "ar"
      ? "ar"
      : currentLanguage === "fr"
        ? "fr-FR"
        : "en-US";

  return new Date(dateValue).toLocaleDateString(locale, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function showLoading() {
  newsContainerElement.innerHTML = \`
    <div class="status-message">
      \${getCurrentText().loading}
    </div>
  \`;
}

function showMessage(message) {
  newsContainerElement.innerHTML = \`
    <div class="status-message">
      \${message}
    </div>
  \`;
}

function escapeHtml(value) {
  if (!value) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function normalizeArticle(article) {
  return {
    title: article.title || "Labarkouh News",
    description: article.description || "",
    source:
      article.source?.name ||
      article.source ||
      "Labarkouh News",
    publishedAt: article.publishedAt || article.published\_at,
    image:
      article.urlToImage ||
      article.image ||
      "https://images.unsplash.com/photo-1504711434969-e33886168f5c",
    url: article.url || "#"
  };
}

function renderNews(articles) {
  const text = getCurrentText();

  if (!articles || articles.length === 0) {
    showMessage(text.noNews);
    return;
  }

  newsContainerElement.innerHTML = articles
    .map((rawArticle) => {
      const article = normalizeArticle(rawArticle);

      return \`
        <article class="news-card">
          <img
            class="news-image"
            src="\${escapeHtml(article.image)}"
            alt=""
            loading="lazy"
            onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c'"
          />

          <div class="news-content">
            <div class="news-meta">
              <span>\${escapeHtml(article.source)}</span>
              <span>\${formatDate(article.publishedAt)}</span>
            </div>

            <h3 class="news-title">
              \${escapeHtml(article.title)}
            </h3>

            <p class="news-description">
              \${escapeHtml(article.description)}
            </p>

            <a
              class="read-link"
              href="\${escapeHtml(article.url)}"
              target="\_blank"
              rel="noopener noreferrer"
            >
              \${text.read}
            </a>
          </div>
        </article>
      \`;
    })
    .join("");
}

async function fetchNewsFromApi() {
  if (!CONFIG.apiUrl) {
    throw new Error("API URL is not configured");
  }

  const url = new URL(CONFIG.apiUrl);

  url.searchParams.set("category", currentCategory);
  url.searchParams.set("language", currentLanguage);

  if (CONFIG.apiKey) {
    url.searchParams.set("apiKey", CONFIG.apiKey);
  }

  const response = await fetch(url.toString());

  if (!response.ok) {
    throw new Error("Failed to load news");
  }

  const data = await response.json();

  return data.articles || data.results || [];
}

async function loadNews() {
  showLoading();

  try {
    let articles;

    if (CONFIG.useDemoData || !CONFIG.apiUrl) {
      await new Promise((resolve) => {
        setTimeout(resolve, 400);
      });

      articles = demoNews[currentCategory] || [];
    } else {
      articles = await fetchNewsFromApi();
    }

    renderNews(articles);
  } catch (error) {
    console.error(error);
    showMessage(getCurrentText().error);
  }
}

function selectCategory(category) {
  currentCategory = category;

  categoryButtons.forEach((button) => {
    button.classList.toggle(
      "active",
      button.dataset.category === category
    );
  });

  loadNews();
}

languageSelectElement.addEventListener("change", (event) => {
  currentLanguage = event.target.value;

  localStorage.setItem("language", currentLanguage);

  updateInterface();
  loadNews();
});

refreshButtonElement.addEventListener("click", () => {
  loadNews();
});

categoryButtons.forEach((button) => {
  button.addEventListener("click", () => {
    selectCategory(button.dataset.category);
  });
});

currentYearElement.textContent = new Date().getFullYear();

updateInterface();
loadNews();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js")
      .then(() => {
        console.log("Service Worker registered successfully");
      })
      .catch((error) => {
        console.error("Service Worker registration failed:", error);
      });
  });
}
