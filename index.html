<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#002664" />
  <meta name="description" content="لاباركوه نيوز - أخبار تشاد وأفريقيا والعالم والرياضة لحظة بلحظة" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Labarkouh" />
  <title>لاباركوه نيوز | Labarkouh News</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23002664' width='100' height='100' rx='22'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23FECB00' font-family='system-ui,Arial' font-weight='800'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23002664' width='100' height='100' rx='22'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23FECB00' font-family='system-ui,Arial' font-weight='800'%3EL%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      /* Chad flag inspired: Blue · Yellow · Red */
      --chad-blue: #002664;
      --chad-yellow: #FECB00;
      --chad-red: #C60C30;
      --primary: #C60C30;
      --primary-hover: #9e0a26;
      --primary-soft: #fde8ec;
      --accent: #002664;
      --accent-2: #FECB00;
      --dark: #0b1220;
      --dark-2: #152238;
      --gray: #64748b;
      --gray-light: #94a3b8;
      --light: #f7f9fc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(0, 38, 100, 0.07);
      --shadow-hover: 0 12px 32px rgba(0, 38, 100, 0.14);
      --radius: 16px;
      --radius-sm: 10px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --transition: 0.18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--light);
      color: var(--dark);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    button, select { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; }

    /* ========== Ticker ========== */
    .ticker-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, var(--chad-blue), #003a8c 40%, var(--chad-red));
      color: #fff;
      padding: 9px 0;
      overflow: hidden;
      position: relative;
      z-index: 25;
      box-shadow: 0 2px 12px rgba(0, 38, 100, 0.3);
    }

    .ticker-label {
      flex: 0 0 auto;
      background: var(--chad-yellow);
      color: var(--chad-blue);
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-inline-start: 16px;
      white-space: nowrap;
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    }

    [dir="rtl"] .ticker-viewport {
      mask-image: linear-gradient(270deg, transparent, #000 6%, #000 94%, transparent);
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: ticker-scroll 28s linear infinite;
      will-change: transform;
    }

    .ticker-track:hover { animation-play-state: paused; }

    .ticker-item {
      color: #fff;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: opacity var(--transition);
    }

    .ticker-item:hover { opacity: 0.85; text-decoration: underline; }

    .ticker-sep {
      padding: 0 16px;
      opacity: 0.55;
      font-size: 12px;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    [dir="rtl"] .ticker-track {
      animation-name: ticker-scroll-rtl;
    }

    @keyframes ticker-scroll-rtl {
      from { transform: translateX(0); }
      to { transform: translateX(50%); }
    }

    /* ========== Header ========== */
    .top-header {
      background: linear-gradient(145deg, var(--chad-blue) 0%, #001a44 55%, #0b1220 100%);
      color: white;
      padding: 26px 16px 22px;
      position: relative;
      overflow: hidden;
    }

    .top-header::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 85% 15%, rgba(254, 203, 0, 0.12), transparent 50%),
        radial-gradient(ellipse at 15% 80%, rgba(198, 12, 48, 0.15), transparent 45%);
      pointer-events: none;
    }

    .header-content,
    .main-content,
    .categories {
      width: min(1120px, 100%);
      margin-inline: auto;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
    }

    .brand-small {
      color: var(--chad-yellow);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: clamp(26px, 5.2vw, 42px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .brand-description {
      color: #94a3b8;
      margin-top: 10px;
      font-size: 14.5px;
      max-width: 420px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .language-select {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      backdrop-filter: blur(8px);
      min-width: 130px;
    }

    .language-select:hover,
    .language-select:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .language-select option {
      background: var(--dark-2);
      color: white;
    }

    .notify-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(254, 203, 0, 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      background: rgba(254, 203, 0, 0.15);
      color: var(--chad-yellow);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .notify-btn:hover {
      background: rgba(254, 203, 0, 0.3);
      color: #fff;
      border-color: rgba(254, 203, 0, 0.55);
    }

    .notify-btn.enabled {
      background: rgba(34, 197, 94, 0.25);
      color: #bbf7d0;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .notify-btn.enabled:hover {
      background: rgba(34, 197, 94, 0.4);
      color: #fff;
    }

    .notify-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notify-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ========== Categories ========== */
    .category-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0, 38, 100, 0.06);
    }

    .categories {
      padding: 14px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .categories::-webkit-scrollbar { display: none; }

    .category-button {
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      padding: 9px 18px;
      white-space: nowrap;
      font-size: 13.5px;
      font-weight: 700;
      transition: all var(--transition);
      border: 1px solid transparent;
    }

    .category-button:hover {
      background: #e2e8f0;
      color: var(--dark);
    }

    .category-button.active {
      background: var(--chad-blue);
      color: white;
      box-shadow: 0 4px 14px rgba(0, 38, 100, 0.35);
    }

    .category-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ========== Main ========== */
    .main-content {
      padding: 28px 16px 48px;
      flex: 1;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .section-title {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .refresh-button {
      border-radius: 10px;
      background: var(--chad-blue);
      color: white;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 13.5px;
      transition: background var(--transition), transform var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-button:hover:not(:disabled) {
      background: #001a44;
      transform: translateY(-1px);
    }

    .refresh-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .refresh-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ========== News Grid ========== */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .news-card {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }

    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .news-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }

    .news-content {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .news-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--gray);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .news-meta-source {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--chad-blue);
    }

    .lang-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #64748b;
      letter-spacing: 0.4px;
    }

    .news-title {
      font-size: 16.5px;
      line-height: 1.45;
      margin-bottom: 8px;
      font-weight: 800;
      color: var(--dark);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-description {
      color: #475569;
      font-size: 13.5px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .read-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      color: var(--chad-red);
      text-decoration: none;
      font-weight: 700;
      font-size: 13.5px;
      transition: color var(--transition);
    }

    .read-link:hover {
      color: var(--primary-hover);
    }

    .read-link::after {
      content: "→";
      transition: transform var(--transition);
    }

    [dir="rtl"] .read-link::after {
      content: "←";
    }

    .read-link:hover::after {
      transform: translateX(3px);
    }

    [dir="rtl"] .read-link:hover::after {
      transform: translateX(-3px);
    }

    .status-message {
      text-align: center;
      background: var(--white);
      color: var(--gray);
      border-radius: var(--radius);
      padding: 48px 20px;
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    /* Skeleton */
    .skeleton-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      height: 340px;
      position: relative;
    }

    .skeleton-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 190px;
      background: #e2e8f0;
    }

    .skeleton-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ========== Footer ========== */
    .footer {
      margin-top: auto;
      background: var(--chad-blue);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 28px 16px;
      font-size: 13.5px;
    }

    .footer strong {
      color: #e2e8f0;
      font-weight: 700;
    }

    /* ========== Responsive ========== */
    @media (max-width: 960px) {
      .news-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
    }

    @media (max-width: 640px) {
      .header-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
      }
      .header-actions {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }
      .language-select,
      .notify-btn {
        width: 100%;
        justify-content: center;
      }
      .news-grid { grid-template-columns: 1fr; gap: 16px; }
      .section-title { font-size: 22px; }
      .category-bar { top: 0; }
      .ticker-label { margin-inline-start: 12px; font-size: 10px; padding: 4px 10px; }
      .news-image { height: 200px; }
      .main-content { padding-top: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none !important; }
      .news-card, .refresh-button, .category-button { transition: none; }
    }
  </style>
</head>

<body>
  <header class="top-header">
    <div class="header-content">
      <div>
        <div class="brand-small">LIVE NEWS</div>
        <h1 class="brand-title" id="appName">لاباركوه نيوز</h1>
        <p class="brand-description" id="appDescription">أخبار تشاد وأفريقيا والعالم والرياضة</p>
      </div>
      <div class="header-actions">
        <button type="button" class="notify-btn" id="notifyButton" aria-label="تفعيل الإشعارات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notifyButtonText">تفعيل الإشعارات</span>
        </button>
        <select id="languageSelect" class="language-select" aria-label="Language / اللغة">
          <option value="ar">العربية</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </header>

  <!-- شريط الأخبار العاجلة تحت العنوان -->
  <div class="ticker-wrap" id="tickerWrap" style="display:none;" role="marquee" aria-live="off">
    <span class="ticker-label" id="tickerLabel">عاجل</span>
    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>

  <nav class="category-bar" aria-label="News categories">
    <div class="categories" id="categories">
      <button class="category-button active" data-category="chad" type="button">تشاد</button>
      <button class="category-button" data-category="africa" type="button">أفريقيا</button>
      <button class="category-button" data-category="world" type="button">العالم</button>
      <button class="category-button" data-category="sports" type="button">الرياضة</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="section-head">
      <h2 class="section-title" id="sectionTitle">آخر الأخبار</h2>
      <button class="refresh-button" id="refreshButton" type="button">تحديث</button>
    </div>
    <section id="newsContainer" class="news-grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    © <span id="currentYear"></span> <strong>Labarkouh News</strong> — أخبار موثوقة من مصادر متعددة
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
