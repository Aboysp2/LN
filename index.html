<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="لاباركوه نيوز - أخبار تشاد وأفريقيا والعالم والرياضة" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>لاباركوه نيوز | Labarkouh News</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    :root {
      --primary: #dc2626;
      --dark: #0f172a;
      --gray: #64748b;
      --light: #f1f5f9;
      --white: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--light); color: var(--dark); font-family: system-ui, -apple-system, Arial, Helvetica, sans-serif; }
    button, select { font-family: inherit; }
    button { cursor: pointer; }
    .top-header { background: var(--dark); color: white; padding: 22px 16px; }
    .header-content, .main-content, .categories { width: min(1100px, 100%); margin: auto; }
    .header-content { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand-small { color: #f87171; font-size: 12px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; }
    .brand-title { font-size: clamp(25px, 5vw, 40px); font-weight: 900; }
    .brand-description { color: #cbd5e1; margin-top: 8px; font-size: 14px; }
    .language-select { border: 0; border-radius: 8px; padding: 10px 12px; background: white; color: var(--dark); font-size: 14px; outline: none; }
    .category-bar { position: sticky; top: 0; z-index: 10; background: white; border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .categories { padding: 12px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category-button { border: 0; border-radius: 999px; background: #f1f5f9; color: #334155; padding: 10px 18px; white-space: nowrap; font-size: 14px; font-weight: bold; transition: background 0.15s; }
    .category-button.active { background: var(--primary); color: white; }
    .main-content { padding: 25px 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
    .section-title { font-size: 26px; font-weight: 900; }
    .refresh-button { border: 0; border-radius: 8px; background: var(--dark); color: white; padding: 10px 15px; font-weight: bold; }
    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .news-card { overflow: hidden; background: white; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 3px 12px rgba(15,23,42,0.05); transition: transform 0.15s; }
    .news-card:hover { transform: translateY(-2px); }
    .news-image { width: 100%; height: 190px; object-fit: cover; background: #cbd5e1; }
    .news-content { padding: 16px; }
    .news-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--gray); font-size: 12px; margin-bottom: 10px; }
    .news-title { font-size: 18px; line-height: 1.6; margin-bottom: 10px; }
    .news-description { color: #475569; font-size: 14px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .read-link { display: inline-block; margin-top: 15px; color: var(--primary); text-decoration: none; font-weight: bold; }
    .status-message { text-align: center; background: white; color: var(--gray); border-radius: 12px; padding: 35px 15px; grid-column: 1 / -1; }
    .footer { margin-top: 35px; background: var(--dark); color: #94a3b8; text-align: center; padding: 25px 15px; font-size: 14px; }
    @media (max-width: 850px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .header-content { align-items: flex-start; flex-direction: column; }
      .language-select { width: 100%; }
      .news-grid { grid-template-columns: 1fr; }
      .section-title { font-size: 22px; }
    }
  </style>
</head>

<body>
  <header class="top-header">
    <div class="header-content">
      <div>
        <div class="brand-small">LIVE NEWS</div>
        <h1 class="brand-title" id="appName">لاباركوه نيوز</h1>
        <p class="brand-description" id="appDescription">أخبار تشاد وأفريقيا والعالم والرياضة</p>
      </div>
      <select id="languageSelect" class="language-select">
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <nav class="category-bar">
    <div class="categories" id="categories">
      <button class="category-button active" data-category="breaking">عاجل</button>
      <button class="category-button" data-category="chad">تشاد</button>
      <button class="category-button" data-category="africa">أفريقيا</button>
      <button class="category-button" data-category="world">العالم</button>
      <button class="category-button" data-category="sports">الرياضة</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="section-head">
      <h2 class="section-title" id="sectionTitle">آخر الأخبار</h2>
      <button class="refresh-button" id="refreshButton">تحديث</button>
    </div>
    <section id="newsContainer" class="news-grid"></section>
  </main>

  <footer class="footer">
    © <span id="currentYear"></span> Labarkouh News
  </footer>

  <script src="script.js"></script>
</body>
</html>
