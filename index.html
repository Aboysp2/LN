<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labarkouh News - لاباركوه نيوز</title>
    
    <!-- Tailwind CSS (للتصميم السريع والمتجاوب) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط جوجل (Cairo للعربية و Inter للغات اللاتينية) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* تخصيص الخطوط */
        body { font-family: 'Cairo', sans-serif; }
        html[lang="fr"], html[lang="en"] body { font-family: 'Inter', sans-serif; }
        
        /* سكرول بار مخصص */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* أنيميشن شريط الأخبار العاجلة */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            animation: ticker 40s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        
        /* دعم اتجاه النص للشريط */
        [dir="rtl"] .ticker-content {
            animation-direction: reverse;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col">

    <!-- الهيدر العلوي -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 id="appName" class="text-2xl font-bold text-blue-600">لاباركوه نيوز</h1>
                <p id="appDescription" class="text-xs text-gray-500 mt-1">أخبار تشاد وأفريقيا والعالم والرياضة</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="refreshButton" class="p-2 rounded-full hover:bg-gray-100 transition text-gray-600" title="تحديث">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
                
                <select id="languageSelect" class="bg-gray-100 border-none rounded-lg text-sm px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <!-- أزرار التصنيفات (Tabs) -->
        <div class="border-t border-gray-100 bg-white">
            <div class="max-w-7xl mx-auto px-4 overflow-x-auto">
                <nav class="flex space-x-8 space-x-reverse py-3" id="categoryNav">
                    <!-- سيتم توليد الأزرار هنا بواسطة الجافاسكريبت -->
                </nav>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        
        <!-- عنوان القسم -->
        <div class="mb-6 flex items-center justify-between">
            <h2 id="sectionTitle" class="text-xl font-bold text-gray-800 border-r-4 border-blue-600 pr-3 ltr:border-r-0 ltr:border-l-4 ltr:pr-0 ltr:pl-3">
                آخر الأخبار
            </h2>
            <span id="lastUpdated" class="text-xs text-gray-400"></span>
        </div>

        <!-- حالة التحميل -->
        <div id="loadingState" class="hidden py-20 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-500">جاري تحميل الأخبار...</p>
        </div>

        <!-- حالة الخطأ -->
        <div id="errorState" class="hidden py-12 text-center bg-red-50 rounded-lg border border-red-100">
            <svg class="mx-auto h-12 w-12 text-red-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p id="errorMessage" class="text-red-700 font-medium">حدث خطأ أثناء تحميل الأخبار.</p>
            <button onclick="app.init()" class="mt-4 text-sm text-blue-600 underline">حاول مرة أخرى</button>
        </div>

        <!-- شبكة عرض الأخبار -->
        <div id="newsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم إضافة بطاقات الأخبار هنا -->
        </div>

        <!-- حالة عدم وجود أخبار -->
        <div id="emptyState" class="hidden py-12 text-center text-gray-500">
            لا توجد أخبار متاحة حالياً.
        </div>
    </main>

    <!-- الفوتر وشريط الأخبار العاجلة -->
    <footer class="bg-slate-900 text-white pt-4 pb-2">
        <div class="max-w-7xl mx-auto px-4">
            <div class="ticker-wrap">
                <div id="tickerLabel" class="inline-block px-3 bg-blue-600 text-xs font-bold uppercase tracking-wider align-middle leading-8">عاجل</div>
                <div class="inline-block align-middle">
                    <div id="tickerTrack" class="ticker-content text-sm text-gray-300 whitespace-nowrap px-2">
                        <!-- سيتم ملء الشريط بالأخبار -->
                    </div>
                </div>
            </div>
            <div class="mt-4 text-center text-xs text-gray-500 border-t border-gray-800 pt-2">
                &copy; <span id="currentYear">2024</span> Labarkouh News. All rights reserved.
            </div>
        </div>
    </footer>
