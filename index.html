<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labarkouh News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
        [dir="ltr"] { text-align: left; }
        [dir="rtl"] { text-align: right; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- الهيدر -->
    <header class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Labarkouh News</h1>
            <select id="langSelect" class="text-black p-1 rounded" onchange="changeLang(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <!-- الأزرار -->
    <nav class="max-w-5xl mx-auto p-4 flex gap-2 overflow-x-auto">
        <button onclick="loadCategory('breaking')" class="bg-white px-4 py-2 rounded shadow">عاجل</button>
        <button onclick="loadCategory('chad')" class="bg-white px-4 py-2 rounded shadow">تشاد</button>
        <button onclick="loadCategory('world')" class="bg-white px-4 py-2 rounded shadow">عالم</button>
    </nav>

    <!-- المحتوى -->
    <main id="newsContainer" class="max-w-5xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-center w-full">جاري تحميل الأخبار...</p>
    </main>

    <script>
        const CONFIG = {
            feeds: {
                breaking: [{name: "BBC", url: "https://feeds.bbci.co.uk/arabic/rss.xml", lang: "ar"}],
                chad: [{name: "Tchadinfos", url: "https://tchadinfos.com/feed/", lang: "fr"}],
                world: [{name: "BBC World", url: "https://feeds.bbci.co.uk/news/world/rss.xml", lang: "en"}]
            }
        };

        function changeLang(lang) {
            localStorage.setItem("lang", lang);
            location.reload();
        }

        async function loadCategory(cat) {
            const lang = localStorage.getItem("lang") || "ar";
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            
            const container = document.getElementById('newsContainer');
            container.innerHTML = "Loading...";

            // فلترة الروابط حسب اللغة المختارة فقط لمنع اللخبطة
            const feeds = CONFIG.feeds[cat].filter(f => f.lang === lang);
            
            let html = "";
            for (let feed of feeds) {
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`);
                    const data = await res.json();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data.contents, "text/xml");
                    const items = xml.querySelectorAll("item");
                    
                    items.forEach((item, index) => {
                        if(index < 3) {
                            const title = item.querySelector("title").textContent;
                            const link = item.querySelector("link").textContent;
                            html += `<div class="bg-white p-4 rounded shadow"><h3 class="font-bold">${title}</h3><a href="${link}" class="text-blue-500" target="_blank">اقرأ المزيد</a></div>`;
                        }
                    });
                } catch(e) { console.error(e); }
            }
            container.innerHTML = html || "لا توجد أخبار بهذه اللغة.";
        }

        // تشغيل أولي
        loadCategory('breaking');
    </script>
</body>
</html>
